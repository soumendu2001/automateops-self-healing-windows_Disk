---
- name: Disk Analysis Report
  hosts: "{{ target_host }}"
  gather_facts: true

  vars:
    report_path: "C:\\Temp\\disk_analysis_report.txt"

  tasks:

    ####################################################################
    # Create Report Folder
    ####################################################################

    - name: Create report folder
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    ####################################################################
    # Top 20 Largest Files
    ####################################################################

    - name: Get top 20 largest files
      ansible.windows.win_shell: |

        Get-ChildItem {{ drive_letter }}:\ -Recurse -File `
        -ErrorAction SilentlyContinue |

        Sort-Object Length -Descending |

        Select-Object -First 20 `
        FullName,
        @{Name='SizeGB';Expression={[math]::Round($_.Length/1GB,2)}} |

        ConvertTo-Json -Depth 5

      register: largest_files

    ####################################################################
    # Top 20 Largest Directories
    ####################################################################

    - name: Get top 20 largest directories
      ansible.windows.win_shell: |

        $folders = Get-ChildItem {{ drive_letter }}:\ `
        -Directory `
        -Recurse `
        -ErrorAction SilentlyContinue

        $results = foreach($folder in $folders)
        {
            $size = (
                Get-ChildItem $folder.FullName `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum
            ).Sum

            [PSCustomObject]@{
                Folder=$folder.FullName
                SizeGB=[math]::Round($size/1GB,2)
            }
        }

        $results |
        Sort-Object SizeGB -Descending |
        Select-Object -First 20 |
        ConvertTo-Json -Depth 5

      register: largest_dirs

    ####################################################################
    # Build Report
    ####################################################################

    - name: Generate disk analysis report
      ansible.windows.win_copy:
        content: |

          ==========================================
          DISK ANALYSIS REPORT
          ==========================================

          Server : {{ inventory_hostname }}
          Drive  : {{ drive_letter }}:
          Date   : {{ lookup('pipe','date -Iseconds')}}

          ==========================================
          TOP 20 LARGEST FILES
          ==========================================

          {{ largest_files.stdout }}

          ==========================================
          TOP 20 LARGEST DIRECTORIES
          ==========================================

          {{ largest_dirs.stdout }}

        dest: "{{ report_path }}"

    ####################################################################
    # Fetch Report
    ####################################################################

    - name: Fetch report to controller
      fetch:
        src: "{{ report_path }}"
        dest: "/tmp/"
        flat: true

    ####################################################################
    # Email Notification
    ####################################################################

    - name: Send Email Report
      delegate_to: localhost
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ email_sender }}"
        to:
          - "{{ email_recipient }}"
        subject: >
          Disk Analysis Report - {{ inventory_hostname }}
        body: |
          Disk cleanup could not reduce utilization
          below threshold.

          Please find attached report containing
          Top 20 Largest Files and Directories.

        attach:
          - "/tmp/disk_analysis_report.txt"

      ignore_errors: true

    ####################################################################
    # Teams Notification
    ####################################################################

    - name: Send Teams Notification
      delegate_to: localhost
      uri:
        url: "{{ teams_webhook_url }}"
        method: POST
        body_format: json

        body:
          title: "Disk Analysis Report"
          text: |
            Server: {{ inventory_hostname }}

            Auto-remediation could not free
            sufficient space.

            Largest files and directories
            report has been generated.

      ignore_errors: true

    ####################################################################
    # ServiceNow Incident Update
    ####################################################################

    - name: Update ServiceNow Incident
      delegate_to: localhost
      uri:
        url: "{{ snow_instance }}/api/now/table/incident/{{ incident_sys_id }}"
        method: PATCH

        user: "{{ snow_user }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes

        body_format: json

        body:
          work_notes: |
            Disk remediation failed.

            Top 20 largest files and directories
            collected automatically.

            Review attached report.

      ignore_errors: true

    ####################################################################
    # Display Summary
    ####################################################################

    - name: Display report location
      debug:
        msg:
          - "Disk analysis completed"
          - "Report saved at {{ report_path }}"
