---
- name: Fast Disk Analysis Report
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    report_path: "C:\\Temp\\disk_analysis_report.txt"
    target_drive: "{{ drive_letter | default('C') }}"

    excluded_folders:
      - Windows
      - "Program Files"
      - "Program Files (x86)"
      - ProgramData
      - "$Recycle.Bin"
      - "System Volume Information"
      - PerfLogs

  tasks:

    ################################################################
    # Create Report Folder
    ################################################################

    - name: Create report folder
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    ################################################################
    # Find Largest Candidate Folders
    ################################################################

    - name: Get top folders excluding OS directories
      ansible.windows.win_shell: |
        $drive = "{{ target_drive }}"
        $exclude = @(
            "Windows",
            "Program Files",
            "Program Files (x86)",
            "ProgramData",
            "$Recycle.Bin",
            "System Volume Information",
            "PerfLogs"
        )

        $results = @()

        Get-ChildItem "{{ drive}}:\" `
        -Directory `
        -ErrorAction SilentlyContinue |

        Where-Object {
            $_.Name -notin $exclude
        } |

        ForEach-Object {

            try {

                $size = (
                    Get-ChildItem $_.FullName `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |

                    Measure-Object Length -Sum
                ).Sum

                $results += [PSCustomObject]@{
                    Folder = $_.FullName
                    SizeGB = [math]::Round($size / 1GB,2)
                }
            }
            catch {}
        }

        $results |
        Sort-Object SizeGB -Descending |
        Select-Object -First 10 |
        ConvertTo-Json -Depth 5

      register: largest_folders

      failed_when: false
      changed_when: false

    ################################################################
    # Select Largest Folder
    ################################################################

    - name: Select largest folder
      set_fact:
        biggest_folder: "{{ (largest_folders.stdout | from_json)[0].Folder }}"

    - name: Display selected folder
      debug:
        msg: "Analyzing {{ biggest_folder }}"

    ################################################################
    # Top Files From Largest Folder Only
    ################################################################

    - name: Get top 20 files
      ansible.windows.win_shell: |

        Get-ChildItem "{{ biggest_folder }}" `
        -File `
        -Recurse `
        -ErrorAction SilentlyContinue |

        Sort-Object Length -Descending |

        Select-Object `
        -First 20 `
        FullName,
        @{Name='SizeGB';Expression={[math]::Round($_.Length/1GB,2)}} |

        ConvertTo-Json -Depth 5

      register: largest_files

      failed_when: false
      changed_when: false

    ################################################################
    # Generate Report
    ################################################################

    - name: Generate report
      ansible.windows.win_copy:
        dest: "{{ report_path }}"
        content: |

          ==========================================
          DISK ANALYSIS REPORT
          ==========================================

          Server : {{ inventory_hostname }}
          Drive  : {{ drive_letter | default('C') }}:

          ==========================================
          TOP 10 LARGEST FOLDERS
          ==========================================

          {{ largest_folders.stdout }}

          ==========================================
          LARGEST FOLDER
          ==========================================

          {{ biggest_folder }}

          ==========================================
          TOP 20 FILES
          ==========================================

          {{ largest_files.stdout }}

    ################################################################
    # Fetch Report
    ################################################################

    - name: Generate report
      ansible.windows.win_copy:
        
        dest: "{{ report_path}}"
    
