---
- name: Disk Analysis Report
  hosts: "{{ target_host }}"
  gather_facts: true

  vars:
    report_path: "C:\\Temp\\disk_analysis_report.txt"

  tasks:

    ####################################################################
    # Create Report Folder
    ####################################################################

    - name: Create report folder
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    ####################################################################
    # Top 20 Largest Files
    ####################################################################

    - name: Get top 20 largest files
      ansible.windows.win_shell: |

        try
        {
            Get-ChildItem {{ drive_letter | default('C') }}:\ `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |

            Sort-Object Length -Descending |

            Select-Object `
            -First 20 `
            FullName,
            @{Name='SizeGB';Expression={[math\]::Round($_.Length/1GB,2)}} |

            ConvertTo-Json -Depth 5

            exit 0
        }
        catch
        {
            "[]"
            exit 0
        }

      register: largest_files

      changed_when: false
      failed_when: false

    ####################################################################
    # Top 20 Largest Directories
    ####################################################################

    - name: Get top 20 largest directories
      ansible.windows.win_shell: |

        try
        {
            $results = @()

            Get-ChildItem {{ drive_letter | default('C') }}:\ `
            -Directory `
            -ErrorAction SilentlyContinue |

            ForEach-Object {

                $folder = $_.FullName

                $size = (
                    Get-ChildItem $folder `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |

                    Measure-Object Length -Sum
                ).Sum

                [PSCustomObject]@{
                    Folder = $folder
                    SizeGB = [math\]::Round($size/1GB,2)
                }
            } |

            Sort-Object SizeGB -Descending |

            Select-Object -First 20 |

            ConvertTo-Json -Depth 5

            exit 0
        }
        catch
        {
            "[]"
            exit 0
        }

      register: largest_dirs

      changed_when: false
      failed_when: false

    ####################################################################
    # Display Findings
    ####################################################################

    - name: Display largest files
      debug:
        var: largest_files.stdout

    - name: Display largest directories
      debug:
        var: largest_dirs.stdout

    ####################################################################
    # Generate Report
    ####################################################################

    - name: Generate disk analysis report
      ansible.windows.win_copy:
        content: |

          ==========================================
          DISK ANALYSIS REPORT
          ==========================================

          Server : {{ inventory_hostname }}
          Drive  : {{ drive_letter | default('C') }}:
          Date   : {{ lookup('pipe', 'date -Iseconds') }}

          ==========================================
          TOP 20 LARGEST FILES
          ==========================================

          {{ largest_files.stdout }}

          ==========================================
          TOP 20 LARGEST DIRECTORIES
          ==========================================

          {{ largest_dirs.stdout }}

        dest: "{{ report_path }}"

    ####################################################################
    # Fetch Report to AWX Controller
    ####################################################################

    - name: Fetch report to controller
      fetch:
        src: "{{ report_path }}"
        dest: "/tmp/"
        flat: true

    ####################################################################
    # Report Summary
    ####################################################################

    - name: Display report location
      debug:
        msg:
          - "Disk analysis completed successfully"
          - "Report saved on server at: {{ report_path }}"
          - "Report copied to AWX controller: /tmp/disk_analysis_report.txt"
