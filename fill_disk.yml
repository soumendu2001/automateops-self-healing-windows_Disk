---
- name: Fill Disk for Testing
  hosts: windows
  gather_facts: false

  tasks:

    - name: Create test directory
      ansible.windows.win_file:
        path: C:\DiskFill
        state: directory

    - name: Create 5 x 1GB files
      ansible.windows.win_shell: |
        1..5 | ForEach-Object {
          fsutil file createnew `
          "C:\DiskFill\dummy$_.dat" `
          1073741824
        }
``
